<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - Seminario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>I - BookShop</h1>
        <div id="cart-icon">
            🛒 Carrito (<span id="cart-count">0</span>)
        </div>
    </header>

    <main class="main-container">
        <section class="form-section">
            <h2>Agregar Producto</h2>
            <form id="product-form">
                <input type="text" id="product-name" placeholder="Título del libro" required>
                <input type="url" id="product-image" placeholder="URL de la imagen" required>
                <input type="number" id="product-price" placeholder="Precio" required>
                <select id="product-category" required>
                    <option value="">Seleccione un Género</option>
                    <option value="Narrativo">Narrativo</option>
                    <option value="Lírico">Lírico</option>
                    <option value="Dramático">Dramático</option>
                    <option value="Didáctico">Didáctico</option>
                    <option value="Novela">Novela</option>
                    <option value="Ciencia Ficción">Ciencia Ficción</option>
                    <option value="Policial">Policial</option>
                    <option value="Infantil / Juvenil">Infantil / Juvenil</option>
                    <option value="Historia / Biografía">Historia / Biografía</option>
                    <option value="Autoayuda / Desarrollo Personal">Autoayuda / Desarrollo Personal</option>
                </select>
                <button type="submit">Agregar al Catálogo</button>
            </form>
        </section>

        <section class="catalog-section">
            <h2>Catálogo</h2>
            <div id="catalog-container">
                <!-- Acá se van a cargar las tarjetas que cree -->
            </div>
        </section>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
